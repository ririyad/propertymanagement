# Checks every pull request and push to main, then deploys to Cloudflare Pages:
# a preview deployment per pull request, production on main (AGENT.md 0.4, 4).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # Branch names reach a shell through wrangler-action, so keep only safe characters.
          echo "branch=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9-' '-')" >> "$GITHUB_OUTPUT"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. See README.md, Deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.credentials.outputs.ready == 'true'
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v4
        id: wrangler
        if: steps.credentials.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=property-ledger --branch=${{ steps.credentials.outputs.branch }}
      - if: steps.credentials.outputs.ready == 'true'
        run: echo "Deployed to ${{ steps.wrangler.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
